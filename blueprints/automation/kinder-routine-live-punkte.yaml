blueprint:
  name: Kinder-Routine – Live-Punkte pro erledigter Aufgabe
  description: >
    Vergibt sofort 1 Punkt, sobald in einer To-Do-Liste (z. B. "Morgenroutine")
    ein Eintrag vor einer Frist-Uhrzeit abgehakt wird – und zieht den Punkt
    wieder ab, falls das Häkchen entfernt wird. Bucht auf einen Wochen- und
    einen Sparkonto-Counter. Eine Instanz dieses Blueprints pro Routine
    (Morgen, Mittag, ...) anlegen.
  domain: automation
  source_url: https://github.com/jacky-coke/daily_routines/blob/main/blueprints/automation/kinder-routine-live-punkte.yaml
  input:
    todo_liste:
      name: To-Do-Liste
      description: Die Routine, die Punkte geben soll.
      selector:
        entity:
          domain: todo
    tracker_helper:
      name: Tages-Tracker (input_number)
      description: >
        Input-Number, die die heute schon fristgerecht erledigten Aufgaben
        dieser Liste zählt (Minimum 0, Maximum = Anzahl Aufgaben in der Liste).
      selector:
        entity:
          domain: input_number
    wochen_counter:
      name: Wochen-Punkte-Counter
      selector:
        entity:
          domain: counter
    punktekonto_counter:
      name: Sparkonto-Counter
      selector:
        entity:
          domain: counter
    anzahl_aufgaben:
      name: Anzahl Aufgaben in der Liste
      description: Muss zum Maximum des Tages-Trackers passen.
      selector:
        number:
          min: 1
          max: 50
          mode: box
    frist_uhrzeit:
      name: Frist-Uhrzeit
      description: Nur bis zu dieser Uhrzeit abgehakte Einträge zählen.
      selector:
        time: {}
    wochentage:
      name: Wochentage
      selector:
        select:
          multiple: true
          options:
            - label: Montag
              value: mon
            - label: Dienstag
              value: tue
            - label: Mittwoch
              value: wed
            - label: Donnerstag
              value: thu
            - label: Freitag
              value: fri
            - label: Samstag
              value: sat
            - label: Sonntag
              value: sun
      default: [mon, tue, wed, thu, fri]

trigger:
  - trigger: state
    entity_id: !input todo_liste

condition:
  - condition: time
    before: !input frist_uhrzeit
  - condition: time
    weekday: !input wochentage

action:
  - variables:
      tracker: !input tracker_helper
      wochen_counter: !input wochen_counter
      punktekonto_counter: !input punktekonto_counter
      max_aufgaben: !input anzahl_aufgaben
      alt: "{{ (trigger.from_state.state if trigger.from_state else max_aufgaben) | int(max_aufgaben) }}"
      neu: "{{ (trigger.to_state.state if trigger.to_state else max_aufgaben) | int(max_aufgaben) }}"
  - variables:
      delta: "{{ alt - neu }}"
  - condition: template
    value_template: "{{ delta != 0 }}"
  - variables:
      bisher: "{{ states(tracker) | int(0) }}"
  - variables:
      neu_wert: "{{ [[bisher + delta, 0] | max, max_aufgaben | int] | min }}"
      angewendet: "{{ ([[bisher + delta, 0] | max, max_aufgaben | int] | min) - bisher }}"
  - action: input_number.set_value
    target:
      entity_id: "{{ tracker }}"
    data:
      value: "{{ neu_wert }}"
  - action: counter.set_value
    target:
      entity_id: "{{ wochen_counter }}"
    data:
      value: "{{ states(wochen_counter) | int(0) + angewendet }}"
  - action: counter.set_value
    target:
      entity_id: "{{ punktekonto_counter }}"
    data:
      value: "{{ states(punktekonto_counter) | int(0) + angewendet }}"

mode: queued
max: 10
