# Analog zu nachtlicher_reset_morgen.yaml, eine Minute früher, damit sich
# die beiden Läufe nicht überschneiden.

alias: "Kind Mittagsroutine – Nächtlicher Reset"
triggers:
  - trigger: time
    at: "23:58:00"
actions:
  - action: todo.get_items
    data: { status: completed }
    target: { entity_id: todo.kind_mittagsroutine }
    response_variable: erledigte
  - repeat:
      for_each: "{{ erledigte['todo.kind_mittagsroutine']['items'] | map(attribute='summary') | list }}"
      sequence:
        - action: todo.update_item
          data:
            item: "{{ repeat.item }}"
            status: needs_action
          target: { entity_id: todo.kind_mittagsroutine }
  - action: input_number.set_value
    data: { value: 0 }
    target: { entity_id: input_number.kind_erledigt_mittag_heute }
mode: single
