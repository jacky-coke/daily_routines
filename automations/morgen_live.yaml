# Live-Punktevergabe für die Morgenroutine.
# Entspricht 1:1 einer Instanz des Blueprints
# blueprints/automation/kinder-routine-live-punkte.yaml – hier als reines
# YAML zum Kopieren, falls du keine Blueprints nutzen willst.
#
# Ersetze:
#   todo.kind_morgenroutine                    -> deine To-Do-Liste
#   input_number.kind_erledigt_morgen_heute     -> dein Tages-Tracker
#   counter.kind_wochenpunkte                   -> dein Wochen-Counter
#   counter.kind_punktekonto                    -> dein Sparkonto-Counter
#   10                                          -> Anzahl Aufgaben in der Liste
#   07:45:00                                    -> deine Frist-Uhrzeit

alias: "Kind Punkte – Morgen Live"
description: >
  Live-Punktevergabe: bei jedem Häkchen in der Morgenroutine wird sofort
  1 Punkt je fristgerecht erledigtem Eintrag auf Wochenzähler und
  Punktekonto gebucht bzw. beim Entfernen des Häkchens wieder abgezogen.
triggers:
  - trigger: state
    entity_id: todo.kind_morgenroutine
conditions:
  - condition: time
    before: "07:45:00"
  - condition: time
    weekday: [mon, tue, wed, thu, fri]
actions:
  - variables:
      alt: "{{ (trigger.from_state.state if trigger.from_state else '10') | int(10) }}"
      neu: "{{ (trigger.to_state.state if trigger.to_state else '10') | int(10) }}"
  - variables:
      delta: "{{ alt - neu }}"
  - condition: template
    value_template: "{{ delta != 0 }}"
  - variables:
      bisher: "{{ states('input_number.kind_erledigt_morgen_heute') | int(0) }}"
  - variables:
      neu_wert: "{{ [[bisher + delta, 0] | max, 10] | min }}"
  - variables:
      angewendet: "{{ neu_wert - bisher }}"
  - action: input_number.set_value
    target:
      entity_id: input_number.kind_erledigt_morgen_heute
    data:
      value: "{{ neu_wert }}"
  - action: counter.set_value
    target:
      entity_id: counter.kind_wochenpunkte
    data:
      value: "{{ states('counter.kind_wochenpunkte') | int(0) + angewendet }}"
  - action: counter.set_value
    target:
      entity_id: counter.kind_punktekonto
    data:
      value: "{{ states('counter.kind_punktekonto') | int(0) + angewendet }}"
mode: queued
