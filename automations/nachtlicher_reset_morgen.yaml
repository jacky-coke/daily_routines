# Setzt jede Nacht alle abgehakten Punkte der Morgenroutine zurück auf
# "offen", blendet die Liste für den neuen Tag wieder ein und setzt den
# Live-Tracker auf 0. Liest die Einträge dynamisch aus der Liste, damit
# später hinzugefügte Aufgaben automatisch mit zurückgesetzt werden.

alias: "Kind Morgenroutine – Nächtlicher Reset"
triggers:
  - trigger: time
    at: "23:59:00"
    id: reset
actions:
  - action: todo.get_items
    data: { status: completed }
    target: { entity_id: todo.kind_morgenroutine }
    response_variable: erledigte
  - repeat:
      for_each: "{{ erledigte['todo.kind_morgenroutine']['items'] | map(attribute='summary') | list }}"
      sequence:
        - action: todo.update_item
          data:
            item: "{{ repeat.item }}"
            status: needs_action
          target: { entity_id: todo.kind_morgenroutine }
  - action: input_boolean.turn_on
    target: { entity_id: input_boolean.kind_morgenroutine_sichtbar }
  - action: input_number.set_value
    data: { value: 0 }
    target: { entity_id: input_number.kind_erledigt_morgen_heute }
  - action: input_text.set_value
    data: { value: "" }
    target: { entity_id: input_text.kind_fehlten_morgen_heute }
mode: single
