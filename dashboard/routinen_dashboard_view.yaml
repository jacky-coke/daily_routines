# Beispiel-Dashboard-View (Lovelace "sections"-Typ). Enthält die drei
# wichtigsten Bausteine: die Routinen-Liste mit Zeitfenster-Sichtbarkeit,
# den Fortschritts-Hinweis, und das Punkte-Barometer.
#
# Benötigt HACS-Karte "bar-card" (https://github.com/custom-cards/bar-card).
# Passe alle Entity-IDs an deine eigenen an (siehe helpers/helpers.md).
#
# WICHTIG zu den "Aktueller Fortschritt: N/M"-Karten weiter unten: native
# Lovelace-Karten (heading, bar-card) können ihren Text/ihr Maximum nicht
# aus einem Template lesen. Deshalb braucht es EINE Karte pro möglichem
# Zwischenstand, jede mit einer eigenen visibility-Bedingung auf den
# exakten Zustand der To-Do-Liste (= Anzahl noch offener Einträge). Unten
# nur 2 Beispiele – das Muster für die restigen Zwischenstände (3/M bis M-1/M)
# einfach wiederholen.

type: sections
sections:
  - type: grid
    cards:
      - type: heading
        icon: mdi:checkbox-marked-circle-auto-outline
        heading: "Morgenroutine"
        heading_style: title
        visibility:
          - condition: time
            after: "06:00:00"
            before: "08:00:00"
            weekdays: [mon, tue, wed, thu, fri]
      - type: todo-list
        entity: todo.kind_morgenroutine
        display_order: none
        item_tap_action: toggle
        hide_create: true
        hide_section_headers: true
        visibility:
          - condition: time
            after: "06:00:00"
            before: "08:00:00"
            weekdays: [mon, tue, wed, thu, fri]

  - type: grid
    cards:
      - type: heading
        icon: mdi:party-popper
        heading: "Alles erledigt!"
        heading_style: title
        visibility:
          - condition: time
            after: "06:00:00"
            before: "08:00:00"
            weekdays: [mon, tue, wed, thu, fri]
          - condition: state
            entity: todo.kind_morgenroutine
            state: "0"          # 0 offene Einträge = alles erledigt
      # Beispiel für EINEN Zwischenstand (hier: 1 von 10 Aufgaben noch offen).
      # Für jeden weiteren möglichen Wert (2/10, 3/10, ... 9/10) diese Karte
      # kopieren und "state:" sowie den Text in "heading:" anpassen.
      - type: heading
        icon: mdi:walk
        heading: "Aktueller Fortschritt: 9/10"
        heading_style: title
        visibility:
          - condition: time
            after: "06:00:00"
            before: "08:00:00"
            weekdays: [mon, tue, wed, thu, fri]
          - condition: state
            entity: todo.kind_morgenroutine
            state: "1"           # 1 offener Eintrag -> 9 von 10 erledigt
      - type: heading
        icon: mdi:walk
        heading: "Aktueller Fortschritt: 0/10"
        heading_style: title
        visibility:
          - condition: time
            after: "06:00:00"
            before: "08:00:00"
            weekdays: [mon, tue, wed, thu, fri]
          - condition: state
            entity: todo.kind_morgenroutine
            state: "10"          # noch nichts abgehakt

  - type: grid
    column_span: 1
    cards:
      - type: heading
        icon: mdi:trophy-award
        heading: "Punkte-Barometer"
        heading_style: title

      - type: horizontal-stack
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: "Heute: \n{{ states('sensor.kind_punkte_heute') }}/{{ states('sensor.kind_tagesmax') }}"
              # Zwei Varianten, weil das Tages-Maximum sich im Laufe des Tages
              # ändert (10 vormittags, 20 sobald die Mittagsroutine + Bonus
              # dazukommen) - bar-card kann sein "max" nicht templaten, daher
              # zwei Karten mit sich ausschließender visibility.
              - type: custom:bar-card
                entities:
                  - entity: sensor.kind_punkte_heute
                    name: Heute
                direction: up
                height: 160px
                width: 50px
                min: 0
                max: 10
                severity:
                  - color: "#42a5f5"
                    value: 0
                  - color: "#26c281"
                    value: 10
                positions: { icon: "off", name: "off", value: inside }
                visibility:
                  - condition: state
                    entity: input_boolean.kind_morgenroutine_sichtbar
                    state: "on"
              - type: custom:bar-card
                entities:
                  - entity: sensor.kind_punkte_heute
                    name: Heute
                direction: up
                height: 160px
                width: 50px
                min: 0
                max: 20
                severity:
                  - color: "#42a5f5"
                    value: 0
                  - color: "#26c281"
                    value: 20
                positions: { icon: "off", name: "off", value: inside }
                visibility:
                  - condition: state
                    entity: input_boolean.kind_morgenroutine_sichtbar
                    state: "off"

          - type: vertical-stack
            cards:
              - type: markdown
                content: "Woche: \n{{ states('counter.kind_wochenpunkte') }}/100 "
              - type: custom:bar-card
                entities:
                  - entity: counter.kind_wochenpunkte
                    name: Woche
                direction: up
                height: 160px
                width: 50px
                min: 0
                max: 100
                severity:
                  - color: "#42a5f5"
                    value: 0
                  - color: "#ab47bc"
                    value: 50
                  - color: "#ffd700"
                    value: 100
                positions: { icon: "off", name: "off", value: inside }

          - type: vertical-stack
            cards:
              - type: markdown
                content: "Gesamt:\n{{ states('counter.kind_punktekonto') }}"
              - type: custom:bar-card
                entities:
                  - entity: counter.kind_punktekonto
                    name: Punktekonto
                direction: up
                height: 160px
                width: 50px
                min: 0
                max: 1000
                severity:
                  - color: "#42a5f5"
                    value: 0
                  - color: "#ab47bc"
                    value: 300
                  - color: "#ffa726"
                    value: 500
                  - color: "#ffd700"
                    value: 1000
                positions: { icon: "off", name: "off", value: inside }

      - type: horizontal-stack
        cards:
          - type: markdown
            content: >-
              **Diese Woche**

              Montag: {{ states('input_text.kind_status_montag') if states('input_text.kind_status_montag') not in ['', 'unknown', 'unavailable'] else '–' }}

              Dienstag: {{ states('input_text.kind_status_dienstag') if states('input_text.kind_status_dienstag') not in ['', 'unknown', 'unavailable'] else '–' }}

              Mittwoch: {{ states('input_text.kind_status_mittwoch') if states('input_text.kind_status_mittwoch') not in ['', 'unknown', 'unavailable'] else '–' }}

              Donnerstag: {{ states('input_text.kind_status_donnerstag') if states('input_text.kind_status_donnerstag') not in ['', 'unknown', 'unavailable'] else '–' }}

              Freitag: {{ states('input_text.kind_status_freitag') if states('input_text.kind_status_freitag') not in ['', 'unknown', 'unavailable'] else '–' }}
          - type: markdown
            content: >-
              ### {{ states('counter.kind_punktekonto') }} Punkte

              {{ '✅' if states('counter.kind_punktekonto')|int(0) >= 100 else '⬜' }} 🕹️ 100 – 15 Min Medienzeit

              {{ '✅' if states('counter.kind_punktekonto')|int(0) >= 200 else '⬜' }} 🕹️🕹️ 200 – 2×15 Min Medienzeit

              {{ '✅' if states('counter.kind_punktekonto')|int(0) >= 300 else '⬜' }} 📱 300 – 1 Std. Medienzeit

              {{ '✅' if states('counter.kind_punktekonto')|int(0) >= 500 else '⬜' }} 🏊 500 – Schwimmbad

              {{ '✅' if states('counter.kind_punktekonto')|int(0) >= 1000 else '⬜' }} 🎬 1000 – Kino

      - type: heading
        icon: mdi:gift-outline
        heading: "Belohnung einlösen"
        heading_style: title
      - type: entities
        entities:
          - input_select.kind_belohnung_auswahl
        grid_options: { columns: 9, rows: auto }
      - type: button
        name: "Einlösen"
        icon: mdi:gift
        tap_action:
          action: call-service
          service: script.kind_belohnung_einloesen
          confirmation:
            text: "Belohnung wirklich einlösen?"
        grid_options: { columns: 3, rows: auto }
